locale: en-US
site_theme: default
title: Yiran Li
title_separator: "·"
name: Yiran Li
description: Academic homepage of Yiran Li, a graduate student at Wuhan University of Technology interested in software quality and trustworthy AI.
url: ""
baseurl: ""
repository:

author:
  name: Yiran Li
  avatar: profile-avatar.svg
  bio: Graduate Student
  employer: Wuhan University of Technology
  github:
  email: # Optional public email address

og_image: profile-avatar.svg
atom_feed:
  hide: true

include:
  - _pages
exclude:
  - AGENTS.md
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/theme.js

encoding: utf-8
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

collections:
  portfolio:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: portfolio
    values:
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

timezone: Asia/Shanghai
plugins:
  - jekyll-sitemap

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
