<ul>
{% assign projects = site.portfolio | sort: "order" %}
{% for project in projects %}
  <li>
    <p>
      <strong><a href="{{ project.url | relative_url }}">{{ project.title }}</a></strong><br>
      {{ project.kind }} · {{ project.period }}<br>
      {{ project.summary }}
    </p>
  </li>
{% endfor %}
</ul>
